name: Arsivi guncelle

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arsivi olustur
        run: |
          python3 - <<'PY'
          import csv, io, json, os, time, datetime, urllib.request

          LIGLER = ["E0","E1","E2","E3","EC","SC0","SC1","SC2","SC3","D1","D2","I1","I2",
                    "SP1","SP2","F1","F2","N1","B1","P1","T1","G1"]
          ILK_SEZON = 2005
          BASE = "https://www.football-data.co.uk/mmz4281/{s}/{l}.csv"
          YAKLASAN = "https://www.football-data.co.uk/fixtures.csv"
          SUTUNLAR = ["tarih","lig","ev","dep","evg","depg","evig","depig","evk","depk","evf","depf",
                      "o1","ox","o2","ou","oa"]

          def indir(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 mac-arsivi"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      b = r.read()
              except Exception as e:
                  print("  atlandi:", url, e)
                  return None
              for enc in ("utf-8-sig", "cp1252", "latin-1"):
                  try:
                      return b.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return None

          def sayi(v):
              try:
                  return int(float(v))
              except (TypeError, ValueError):
                  return None

          def oran(row, *adlar):
              for a in adlar:
                  v = row.get(a)
                  try:
                      f = float(v)
                      if f > 1:
                          return round(f * 100)
                  except (TypeError, ValueError):
                      pass
              return None

          def tarih(v):
              for fmt in ("%d/%m/%Y", "%d/%m/%y"):
                  try:
                      return int(datetime.datetime.strptime(v.strip(), fmt).strftime("%Y%m%d"))
                  except (ValueError, AttributeError):
                      pass
              return None

          def satirlar(text, lig=None):
              out = []
              for row in csv.DictReader(io.StringIO(text)):
                  row = {(k or "").strip(): v for k, v in row.items()}
                  ev, dep, t = row.get("HomeTeam") or row.get("Home"), row.get("AwayTeam") or row.get("Away"), tarih(row.get("Date"))
                  if not ev or not dep or not t:
                      continue
                  out.append({
                      "tarih": t, "lig": lig or row.get("Div"), "ev": ev.strip(), "dep": dep.strip(),
                      "evg": sayi(row.get("FTHG") or row.get("HG")), "depg": sayi(row.get("FTAG") or row.get("AG")),
                      "evig": sayi(row.get("HTHG")), "depig": sayi(row.get("HTAG")),
                      "evk": sayi(row.get("HC")), "depk": sayi(row.get("AC")),
                      "evf": sayi(row.get("HF")), "depf": sayi(row.get("AF")),
                      "o1": oran(row, "AvgH", "BbAvH", "B365H", "PSH"),
                      "ox": oran(row, "AvgD", "BbAvD", "B365D", "PSD"),
                      "o2": oran(row, "AvgA", "BbAvA", "B365A", "PSA"),
                      "ou": oran(row, "Avg>2.5", "BbAv>2.5", "B365>2.5", "P>2.5"),
                      "oa": oran(row, "Avg<2.5", "BbAv<2.5", "B365<2.5", "P<2.5"),
                  })
              return out

          def sezonlar():
              bugun = datetime.date.today()
              son = bugun.year if bugun.month >= 7 else bugun.year - 1
              return [f"{y % 100:02d}{(y + 1) % 100:02d}" for y in range(ILK_SEZON, son + 1)], f"{son % 100:02d}{(son + 1) % 100:02d}"

          def main():
              os.makedirs("onbellek", exist_ok=True)
              liste, guncel = sezonlar()
              maclar = []
              for lig in LIGLER:
                  for s in liste:
                      yol = f"onbellek/{lig}_{s}.json"
                      if s != guncel and os.path.exists(yol):
                          maclar += json.load(open(yol, encoding="utf-8"))
                          continue
                      text = indir(BASE.format(s=s, l=lig))
                      time.sleep(0.3)
                      if not text:
                          continue
                      rows = satirlar(text, lig)
                      json.dump(rows, open(yol, "w", encoding="utf-8"), ensure_ascii=False)
                      maclar += rows
                      print(f"{lig} {s}: {len(rows)} mac")
              maclar.sort(key=lambda m: m["tarih"])
              takimlar = sorted({m["ev"] for m in maclar} | {m["dep"] for m in maclar})
              ti = {t: i for i, t in enumerate(takimlar)}
              li = {l: i for i, l in enumerate(LIGLER)}
              paket = [[m["tarih"], li.get(m["lig"], -1), ti[m["ev"]], ti[m["dep"]]] + [m[k] for k in SUTUNLAR[4:]] for m in maclar]
              zaman = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              json.dump({"v": 1, "guncelleme": zaman, "sutunlar": SUTUNLAR, "ligler": LIGLER,
                         "takimlar": takimlar, "maclar": paket},
                        open("arsiv.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              text = indir(YAKLASAN)
              yak = satirlar(text) if text else []
              json.dump({"guncelleme": zaman, "maclar": yak}, open("yaklasan.json", "w", encoding="utf-8"),
                        ensure_ascii=False, separators=(",", ":"))
              json.dump({"guncelleme": zaman, "mac_sayisi": len(paket), "yaklasan": len(yak),
                         "boyut_kb": os.path.getsize("arsiv.json") // 1024},
                        open("bilgi.json", "w", encoding="utf-8"), ensure_ascii=False)
              print(f"TAMAM: {len(paket)} mac, {len(yak)} yaklasan mac")

          main()
          PY
      - name: Kaydet
        run: |
          git config user.name "arsiv-bot"
          git config user.email "arsiv-bot@users.noreply.github.com"
          git add -A
          git commit -m "Arsiv guncellendi $(date -u +%F)" || echo "Degisiklik yok"
          git push
